data:
  raw_dir: "data/raw"
  watermarked_dir: "data/watermarked_v4_bmp"
  removed_dir: "data/removed_v4_bmp"
  edited_dir: "data/edited"

  splits_dir: "data/splits_v4_bmp"

  img_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42
  num_workers: 0

watermark:
  method: "dwt_dct_svd"
  alpha: 0.08
  block_size: 8
  dwt_level: 2
  watermark_seed: 42
  verify_threshold: 0.5

attack:
  method: "coefficient_attack + distortion, then re-encoded to lossless BMP (Task 2 ablation)"
  coeff_strength_max: 0.4

model:
  name: "convnext_tiny"
  pretrained: true
  num_classes: 2
  dropout: 0.1

train:
  batch_size: 16
  batch_size_fallback: 8
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 12
  device: "auto"
  mixed_precision: true
  grad_clip: 1.0
  early_stopping_patience: 5
  save_dir: "checkpoints_v4_bmp"
  log_dir: "results/logs_v4_bmp"

eval:
  metrics:
    - "accuracy"
    - "auroc"
    - "precision"
    - "recall"
    - "f1"
  save_dir: "results/v4_bmp"
