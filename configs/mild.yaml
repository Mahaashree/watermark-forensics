data:
  raw_dir: "data/raw"
  watermarked_dir: "data/watermarked"
  removed_dir: "data/removed_mild"
  edited_dir: "data/edited"
  splits_dir: "data/splits_mild"
  img_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42
  num_workers: 0

watermark:
  method: "dwt_dct_svd"
  alpha: 0.1
  block_size: 8
  dwt_level: 2
  watermark_seed: 42
  verify_threshold: 0.5

attack:
  method: "distortion"
  jpeg_quality: 80
  gaussian_std: 2.0
  blur_kernel: 1
  resize_factor: 1.0
  num_passes: 1

model:
  name: "convnext_tiny"
  pretrained: true
  num_classes: 2
  dropout: 0.1

train:
  batch_size: 16
  batch_size_fallback: 8
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 12
  device: "auto"
  mixed_precision: true
  grad_clip: 1.0
  early_stopping_patience: 5
  save_dir: "checkpoints_mild"
  log_dir: "results/logs_mild"

eval:
  metrics: ["accuracy", "auroc", "precision", "recall", "f1"]
  save_dir: "results_mild"
