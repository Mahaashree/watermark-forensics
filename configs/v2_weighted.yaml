data:
  raw_dir: "data/raw"
  watermarked_dir: "data/watermarked_v2"
  removed_dir: "data/removed_v2"
  edited_dir: "data/edited"

  splits_dir: "data/splits_v2"

  img_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42
  num_workers: 0

watermark:
  method: "dwt_dct_svd"
  alpha: 0.02
  block_size: 8
  dwt_level: 2
  watermark_seed: 42
  verify_threshold: 0.5

model:
  name: "convnext_tiny"
  pretrained: true
  num_classes: 2
  dropout: 0.1

train:
  batch_size: 16
  batch_size_fallback: 8
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 12
  device: "auto"
  mixed_precision: true
  grad_clip: 1.0
  early_stopping_patience: 5
  save_dir: "checkpoints_v2_weighted"
  log_dir: "results/logs_v2_weighted"
  # Class weighting for CrossEntropyLoss (label 0 = watermarked/clean,
  # label 1 = removed). data/splits_v2/train.csv is 309/321 (0/1) — nearly
  # balanced (~4% skew), so pure inverse-frequency balancing ("auto") would
  # only give ~[1.02, 0.98] and barely move recall. The actual problem this
  # is meant to fix is the recall gap on "removed" (0.74 recall vs 0.85
  # precision at the default 0.5 threshold) — the costlier error direction
  # for a forensic detector. [1.0, 1.3] deliberately upweights class 1
  # ("removed") beyond frequency balance to push the decision boundary
  # toward catching more removals, at an expected precision/accuracy cost.
  # Tune this value based on the Part 2 multi-seed comparison against
  # configs/v2.yaml.
  class_weights: [1.0, 1.3]

eval:
  metrics:
    - "accuracy"
    - "auroc"
    - "precision"
    - "recall"
    - "f1"
  save_dir: "results/v2_weighted"
