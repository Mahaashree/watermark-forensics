data:
  raw_dir: "data/raw"
  watermarked_dir: "data/watermarked_v3"
  removed_dir: "data/removed_v3"
  edited_dir: "data/edited"

  splits_dir: "data/splits_v3"

  img_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42
  num_workers: 0

watermark:
  method: "dwt_dct_svd"
  alpha: 0.02
  block_size: 8
  dwt_level: 2
  watermark_seed: 42
  verify_threshold: 0.5

attack:
  method: "coefficient_attack + distortion"
  coeff_strength_max: 0.05
  # generic distortion drawn per-image, same ranges as v2:
  # num_passes in {0,1,1,2,2,3,4,5}, jpeg_quality in [5,90],
  # gaussian_std in [2,40], blur_kernel in {1,1,3,5,7,9}, resize in [0.25,1.0]

model:
  name: "convnext_tiny"
  pretrained: true
  num_classes: 2
  dropout: 0.1

train:
  batch_size: 16
  batch_size_fallback: 8
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 12
  device: "auto"
  mixed_precision: true
  grad_clip: 1.0
  early_stopping_patience: 5
  save_dir: "checkpoints_v3"
  log_dir: "results/logs_v3"

eval:
  metrics:
    - "accuracy"
    - "auroc"
    - "precision"
    - "recall"
    - "f1"
  save_dir: "results/v3"
