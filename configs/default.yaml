# NOTE: this is the original Phase 1 (construction-labeled) config, kept
# for history. It does NOT produce the currently-reported baseline
# numbers -- those come from configs/v2.yaml onward (verification-based
# labeling). alpha here (0.1) differs from what any reported result
# actually used; see README "Alpha History" before treating this file as
# a reproduction recipe.
data:
  raw_dir: "data/raw"
  watermarked_dir: "data/watermarked_jpeg80"
  removed_dir: "data/removed_jpeg80"
  edited_dir: "data/edited"

  # Existing split files
  splits_dir: "data/splits"

  img_size: 224
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42
  num_workers: 0

watermark:
  method: "dwt_dct_svd"
  alpha: 0.1
  block_size: 8
  dwt_level: 2
  watermark_seed: 42
  verify_threshold: 0.5

attack:
  method: "distortion"
  jpeg_quality: 2
  gaussian_std: 45.0
  blur_kernel: 13
  resize_factor: 0.1
  num_passes: 6

model:
  name: "convnext_tiny"
  pretrained: true
  num_classes: 2
  dropout: 0.1

train:
  batch_size: 16
  batch_size_fallback: 8
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 12
  device: "auto"
  mixed_precision: true
  grad_clip: 1.0
  early_stopping_patience: 5
  save_dir: "checkpoints"
  log_dir: "results/logs"

eval:
  metrics:
    - "accuracy"
    - "auroc"
    - "precision"
    - "recall"
    - "f1"
  save_dir: "results"