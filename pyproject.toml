[project]
name = "watermark-forensics"
version = "0.1.0"
description = "Phase 1: Watermark-Removal Forensics Baseline"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "tqdm>=4.66",
    "albumentations>=1.3",
    "PyWavelets>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]